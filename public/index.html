<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LT French - Guided Transfer Practice</title>
  <meta name="description" content="A small, local-first French learning app inspired by the Language Transfer method.">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#app">Skip to content</a>

  <header class="topbar">
    <button class="brand" data-nav="/" aria-label="Go to home">
      <span class="brand-title">Language Transfer - French</span>
      <span class="brand-subtitle">Guided practice</span>
    </button>
    <span class="topbar-status" id="topbar-status" aria-live="polite">Loading...</span>
    <nav class="topbar-actions" aria-label="Primary">
      <button class="topbar-button" data-nav="/deck">Deck</button>
      <button class="topbar-button" id="settings-open" aria-haspopup="dialog">Settings</button>
    </nav>
  </header>

  <main id="app" class="app" tabindex="-1">
    <section id="loading" class="loading" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <p>Loading course...</p>
    </section>
  </main>

  <div class="modal-overlay hidden" id="settings-modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div class="modal-card" role="document">
      <div class="modal-header">
        <h2 id="settings-title">Settings &amp; data</h2>
        <button class="icon-button" id="settings-close" aria-label="Close settings">x</button>
      </div>
      <div class="modal-section">
        <h3>Progress</h3>
        <p id="storage-summary" class="muted">Storage summary unavailable.</p>
        <div class="action-grid">
          <button id="export-progress">Export progress</button>
          <label class="file-button">Import progress <input id="import-progress" type="file" accept="application/json"></label>
          <button id="reset-track">Reset current track</button>
          <button class="danger" id="reset-all">Reset all local data</button>
        </div>
      </div>
      <div class="modal-section">
        <h3>Practice preferences</h3>
        <label class="check-row"><input type="checkbox" id="pref-autoplay"> Auto-play French after reveal</label>
        <label class="check-row"><input type="checkbox" id="pref-strict-accents"> Treat accent mistakes as incorrect</label>
      </div>
    </div>
  </div>

  <noscript>
    <div class="noscript">This app needs JavaScript to load the course and save your local progress.</div>
  </noscript>
</body>
</html>
