<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LT French — Language Transfer Practice</title>
<style>
:root{
  --ink:#1a1a17;--paper:#f5f2eb;--card:#fff;
  --border:#d4c9b0;--muted:#888;
  --accent:#2c5f3d;--acc-lt:#e8f2ec;--acc-mid:#4a9e6e;
  --amber:#8b5a2b;--amb-lt:#f9f1e8;
  --ok:#2d8b3d;--near:#c08800;--bad:#a83232;
  --serif:Georgia,serif;--mono:'Courier New',monospace;
  --radius:10px;--shadow:0 2px 12px rgba(0,0,0,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--serif);background:var(--paper);color:var(--ink);min-height:100vh}

/* ── TOPBAR ── */
#topbar{background:var(--ink);color:#f5f2eb;padding:.7rem 1.2rem;
  display:flex;align-items:center;gap:.8rem;
  position:sticky;top:0;z-index:300;box-shadow:0 2px 12px rgba(0,0,0,.3)}
#topbar .logo{font-style:italic;font-size:.95rem;cursor:pointer;flex:1}
#topbar .logo span{opacity:.5;font-style:normal;font-size:.75rem;margin-left:.4rem}
.topbar-sub{font-family:var(--mono);font-size:.6rem;opacity:.4}

/* ── VIEWS ── */
.view{display:none;min-height:calc(100vh - 44px)}
.view.active{display:block}

/* ── HOME ── */
#view-home{padding:1.2rem}
.home-header{max-width:900px;margin:0 auto 1.4rem;padding-top:.4rem}
.home-header h1{font-size:1.5rem;font-style:italic;margin-bottom:.3rem}
.home-header p{font-size:.85rem;color:var(--muted);line-height:1.7}
.continue-bar{max-width:900px;margin:0 auto .8rem}
.continue-btn{display:inline-flex;align-items:center;gap:.5rem;
  background:var(--accent);color:#fff;border:none;border-radius:8px;
  padding:.6rem 1.2rem;font-family:var(--serif);font-style:italic;font-size:.9rem;
  cursor:pointer;transition:background .12s}
.continue-btn:hover{background:#1e4029}
.continue-btn .arrow{font-style:normal}
.track-grid{max-width:900px;margin:0 auto;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:.7rem}
.track-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:.9rem 1rem;cursor:pointer;transition:box-shadow .15s,border-color .15s;
  display:flex;flex-direction:column;gap:.35rem;position:relative;overflow:hidden}
.track-card:hover{box-shadow:var(--shadow);border-color:var(--accent)}
.track-card.done{border-color:#b5d4c0}
.track-card.done::after{content:'';position:absolute;top:0;left:0;width:100%;height:3px;background:var(--acc-mid)}
.tc-top{display:flex;align-items:center;justify-content:space-between}
.tc-num{font-family:var(--mono);font-size:.6rem;background:var(--accent);color:#fff;
  padding:2px 6px;border-radius:3px}
.tc-stars{font-size:.75rem;letter-spacing:.05em}
.tc-title{font-size:.82rem;font-weight:bold;font-style:italic;line-height:1.35}
.tc-bar{height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.tc-bar-fill{height:100%;background:var(--acc-mid);transition:width .3s}
.tc-meta{font-family:var(--mono);font-size:.62rem;color:var(--muted)}

/* ── LESSON ── */
#view-lesson{max-width:820px;margin:0 auto;padding:1.2rem 1rem 3rem}
.lesson-nav{display:flex;align-items:center;gap:.6rem;margin-bottom:1.2rem;flex-wrap:wrap}
.btn-back{font-family:var(--mono);font-size:.72rem;background:#fff;border:1px solid var(--border);
  border-radius:6px;padding:5px 12px;cursor:pointer;transition:background .12s}
.btn-back:hover{background:var(--paper)}
.lesson-nav-arrows{display:flex;gap:.4rem;margin-left:auto}
.btn-arrow{font-family:var(--mono);font-size:.7rem;background:#fff;border:1px solid var(--border);
  border-radius:6px;padding:4px 10px;cursor:pointer;transition:background .12s}
.btn-arrow:hover{background:var(--paper)}
.btn-arrow:disabled{opacity:.3;cursor:default}
.lesson-head{margin-bottom:1.4rem}
.lesson-num{font-family:var(--mono);font-size:.6rem;background:var(--accent);color:#fff;
  padding:2px 8px;border-radius:3px;display:inline-block;margin-bottom:.4rem}
.lesson-title{font-size:1.4rem;font-weight:bold;font-style:italic;margin-bottom:.4rem}
.lesson-context{font-size:.88rem;color:#444;line-height:1.7;font-style:italic;
  border-left:3px solid var(--border);padding-left:.9rem}
.section-label{font-family:var(--mono);font-size:.6rem;text-transform:uppercase;
  letter-spacing:.1em;color:var(--muted);margin:1.4rem 0 .5rem}
.grammar-box{background:#fff;border:1px solid var(--border);border-left:3px solid var(--acc-mid);
  border-radius:0 8px 8px 0;padding:.9rem 1.1rem;font-size:.86rem;line-height:1.75;color:#333}
.grammar-box strong{color:var(--accent)}
.grammar-box em{color:var(--amber);font-style:italic}
.word-grid{display:flex;flex-wrap:wrap;gap:6px}
.word-chip{background:var(--amb-lt);border:1px solid #d9c4aa;border-radius:7px;
  padding:5px 11px;display:flex;flex-direction:column}
.wc-fr{font-family:var(--mono);font-size:.8rem;font-weight:500;color:var(--amber)}
.wc-en{font-size:.68rem;color:var(--muted);margin-top:1px}
.sent-table{width:100%;border-collapse:collapse;font-size:.84rem}
.sent-table tr{border-bottom:1px solid var(--border)}
.sent-table tr:last-child{border-bottom:none}
.sent-table td{padding:.5rem .4rem;vertical-align:top}
.sent-table td:first-child{font-family:var(--mono);color:var(--accent);font-weight:500;padding-right:1rem;width:55%}
.sent-table td:last-child{color:#555}
.lesson-cta{position:sticky;bottom:1.2rem;margin-top:2rem;text-align:right}
.btn-practice{background:var(--accent);color:#fff;border:none;border-radius:8px;
  padding:.75rem 1.8rem;font-family:var(--serif);font-style:italic;font-size:1rem;
  cursor:pointer;box-shadow:0 4px 16px rgba(44,95,61,.35);transition:all .12s}
.btn-practice:hover{background:#1e4029;transform:translateY(-1px);box-shadow:0 6px 20px rgba(44,95,61,.4)}

/* ── PRACTICE ── */
#view-practice{max-width:820px;margin:0 auto;padding:1.2rem 1rem 3rem}
.prac-head{display:flex;align-items:flex-start;justify-content:space-between;
  gap:.8rem;flex-wrap:wrap;margin-bottom:.8rem}
.prac-left{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.prac-score{display:flex;align-items:center;gap:.4rem;flex-shrink:0}
.sc{font-family:var(--mono);font-size:.76rem;font-weight:600;
  padding:3px 8px;border-radius:5px;min-width:44px;text-align:center;transition:all .2s}
.sc-ok  {background:#edf7ef;color:var(--ok);border:1.5px solid #b5d4c0}
.sc-near{background:#fdf8e8;color:var(--near);border:1.5px solid #e8d080}
.sc-bad {background:#fef2f2;color:var(--bad);border:1.5px solid #e8b0b0}
.sc-pct {font-family:var(--mono);font-size:.7rem;color:var(--muted);min-width:36px}
.sc.bump{animation:bump .25s ease}
@keyframes bump{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
.char-bar{background:#f0ece3;border:1px solid var(--border);border-radius:8px;
  padding:.4rem .6rem;display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-bottom:.7rem}
.cb-lbl{font-family:var(--mono);font-size:.55rem;color:#aaa;letter-spacing:.08em;
  text-transform:uppercase;margin-right:4px;flex-shrink:0}
.ch{font-family:var(--mono);font-size:.83rem;background:var(--card);border:1px solid var(--border);
  border-radius:4px;padding:2px 6px;cursor:pointer;transition:all .1s;
  color:var(--accent);font-weight:500}
.ch:hover{background:var(--acc-lt);transform:scale(1.12)}
.ch:active{transform:scale(.94)}
.prac-prog{margin-bottom:1rem}
.prog-bar{height:5px;background:var(--border);border-radius:3px;overflow:hidden;margin-bottom:.3rem}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--acc-mid));
  transition:width .35s cubic-bezier(.4,0,.2,1)}
.prog-txt{font-family:var(--mono);font-size:.62rem;color:var(--muted)}
.ex-list{display:flex;flex-direction:column;gap:.65rem}
.ex{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:.9rem 1rem;transition:box-shadow .15s}
.ex.chal{background:var(--amb-lt);border-color:#d9c4aa}
.ex-en{font-size:.92rem;font-weight:500;margin-bottom:.55rem;
  display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;line-height:1.5}
.cbadge{background:var(--amber);color:#fff;font-family:var(--mono);font-size:.56rem;
  padding:1px 6px;border-radius:3px;text-transform:uppercase;letter-spacing:.05em;flex-shrink:0}
.ex-row{display:flex;gap:.5rem}
.ex-inp{flex:1;font-family:var(--mono);font-size:.85rem;padding:7px 10px;
  border:1.5px solid var(--border);border-radius:6px;background:var(--paper);
  color:var(--ink);outline:none;transition:border-color .15s,background .15s}
.ex-inp:focus{border-color:var(--accent);background:#fff}
.ex-inp.ok  {border-color:var(--ok)  !important;background:#edf7ef!important}
.ex-inp.near{border-color:var(--near)!important;background:#fdf8e8!important}
.ex-inp.bad {border-color:var(--bad) !important;background:#fef2f2!important}
.ex-inp:disabled{opacity:.8}
.btn-rev{background:var(--accent);color:#fff;border:none;border-radius:6px;
  padding:7px 14px;font-family:var(--mono);font-size:.7rem;letter-spacing:.04em;
  cursor:pointer;white-space:nowrap;transition:background .12s,transform .1s;flex-shrink:0}
.btn-rev:hover{background:#1e4029}
.btn-rev:active{transform:scale(.95)}
.btn-rev:disabled{background:#aaa;cursor:default;transform:none}
.ex-ans{margin-top:.55rem;padding:.5rem .8rem;background:var(--acc-lt);
  border:1px solid #b5d4c0;border-radius:6px;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.ans-lbl{font-family:var(--mono);font-size:.56rem;text-transform:uppercase;letter-spacing:.1em;color:#666}
.ans-txt{font-family:var(--mono);font-size:.85rem;font-weight:600;color:var(--accent)}
.chk{font-family:var(--mono);font-size:.66rem;margin-left:auto;white-space:nowrap}
.chk.ok  {color:var(--ok)}
.chk.near{color:var(--near)}
.prac-foot{display:flex;gap:.6rem;margin-top:1.4rem;justify-content:flex-end}
.btn-sec{font-family:var(--mono);font-size:.68rem;padding:6px 12px;border-radius:6px;
  cursor:pointer;border:1px solid var(--border);background:#fff;color:var(--ink);transition:all .12s}
.btn-reset:hover{background:#fef2f2;border-color:var(--bad);color:var(--bad)}
.btn-reveal-all:hover{background:var(--acc-lt);border-color:var(--accent);color:var(--accent)}
.completion{display:none;margin-top:1.5rem;background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:1.8rem;text-align:center;animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.comp-stars{font-size:2rem;margin-bottom:.6rem;letter-spacing:.1em}
.comp-msg{font-size:1.2rem;font-style:italic;font-weight:bold;margin-bottom:.3rem}
.comp-sub{font-family:var(--mono);font-size:.72rem;color:var(--muted);margin-bottom:1.2rem;line-height:1.7}
.comp-btns{display:flex;gap:.7rem;justify-content:center;flex-wrap:wrap}
.comp-btn{font-family:var(--mono);font-size:.74rem;padding:8px 16px;border-radius:6px;
  cursor:pointer;border:1.5px solid var(--border);background:#fff;transition:all .12s}
.comp-btn:hover{background:var(--acc-lt);border-color:var(--accent)}
.comp-next{background:var(--accent);color:#fff;border-color:var(--accent)}
.comp-next:hover{background:#1e4029;border-color:#1e4029}

/* ── RESULTS ── */
#view-results{max-width:820px;margin:0 auto;padding:1.2rem 1rem 3rem}
.results-head{margin-bottom:1.4rem}
.results-best{background:var(--acc-lt);border:1px solid #b5d4c0;border-radius:8px;
  padding:.8rem 1rem;display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;margin-bottom:1rem}
.best-label{font-family:var(--mono);font-size:.6rem;text-transform:uppercase;letter-spacing:.1em;color:#666}
.best-stars{font-size:1.1rem}
.best-pct{font-family:var(--mono);font-size:1.1rem;font-weight:bold;color:var(--accent)}
.best-detail{font-family:var(--mono);font-size:.68rem;color:var(--muted)}
.no-history{text-align:center;padding:3rem 1rem;color:var(--muted);font-style:italic}
.attempt-list{display:flex;flex-direction:column;gap:.5rem}
.attempt{background:var(--card);border:1px solid var(--border);border-radius:8px;
  padding:.75rem 1rem;display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
.att-num{font-family:var(--mono);font-size:.62rem;color:var(--muted);flex-shrink:0}
.att-date{font-family:var(--mono);font-size:.7rem;color:var(--muted);flex-shrink:0;min-width:80px}
.att-stars{font-size:.85rem;flex-shrink:0}
.att-pct{font-family:var(--mono);font-size:.82rem;font-weight:600;color:var(--accent);flex-shrink:0;min-width:40px}
.att-detail{font-family:var(--mono);font-size:.66rem;color:var(--muted)}
.btn-practice-again{background:var(--accent);color:#fff;border:none;border-radius:8px;
  padding:.65rem 1.5rem;font-family:var(--serif);font-style:italic;font-size:.9rem;
  cursor:pointer;transition:background .12s;margin-top:1.2rem}
.btn-practice-again:hover{background:#1e4029}

/* ── LOADING ── */
#loading{display:flex;align-items:center;justify-content:center;
  height:calc(100vh - 44px);flex-direction:column;gap:1rem;color:var(--muted)}
.spinner{width:28px;height:28px;border:3px solid var(--border);
  border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

kbd{font-family:var(--mono);font-size:.72rem;background:#eee;
  border:1px solid #ccc;border-radius:3px;padding:1px 5px}
@media(max-width:600px){
  .track-grid{grid-template-columns:repeat(2,1fr)}
  .prac-score .sc-near{display:none}
  .topbar-sub{display:none}
}
</style>
</head>
<body>

<div id="topbar">
  <div class="logo" onclick="nav('/')">
    Language Transfer — French
    <span>Practice App</span>
  </div>
  <span class="topbar-sub" id="topbar-sub">Loading…</span>
</div>

<div id="loading">
  <div class="spinner"></div>
  <span>Loading course…</span>
</div>

<!-- HOME -->
<div id="view-home" class="view">
  <div class="home-header">
    <h1>Introduction to French</h1>
    <p>Follow each track: read the lesson, then practise. Your scores are saved locally.</p>
  </div>
  <div class="continue-bar" id="continue-bar"></div>
  <div class="track-grid" id="track-grid"></div>
</div>

<!-- LESSON -->
<div id="view-lesson" class="view">
  <div class="lesson-nav">
    <button class="btn-back" onclick="nav('/')">← All tracks</button>
    <button class="btn-back" id="btn-results" onclick="navResults()">📊 History</button>
    <div class="lesson-nav-arrows">
      <button class="btn-arrow" id="btn-prev-lesson" onclick="navPrevLesson()">← Prev</button>
      <button class="btn-arrow" id="btn-next-lesson" onclick="navNextLesson()">Next →</button>
    </div>
  </div>
  <div id="lesson-content"></div>
  <div class="lesson-cta">
    <button class="btn-practice" id="btn-start-practice" onclick="navPractice()">
      Start Practice →
    </button>
  </div>
</div>

<!-- PRACTICE -->
<div id="view-practice" class="view">
  <div class="prac-head">
    <div class="prac-left">
      <button class="btn-back" onclick="navLesson(currentTrack)">← Lesson</button>
      <span class="lesson-num" id="prac-track-label" style="font-family:var(--mono);font-size:.6rem;background:var(--accent);color:#fff;padding:2px 8px;border-radius:3px;display:inline-block"></span>
    </div>
    <div class="prac-score">
      <span class="sc sc-ok"  id="sc-ok">✓ 0</span>
      <span class="sc sc-near" id="sc-near">~ 0</span>
      <span class="sc sc-bad" id="sc-bad">✗ 0</span>
      <span class="sc-pct" id="sc-pct">0%</span>
    </div>
  </div>
  <div class="char-bar">
    <span class="cb-lbl">ÀÇ</span>
    <button class="ch" onclick="ins('é')">é</button>
    <button class="ch" onclick="ins('è')">è</button>
    <button class="ch" onclick="ins('ê')">ê</button>
    <button class="ch" onclick="ins('ë')">ë</button>
    <button class="ch" onclick="ins('à')">à</button>
    <button class="ch" onclick="ins('â')">â</button>
    <button class="ch" onclick="ins('î')">î</button>
    <button class="ch" onclick="ins('ï')">ï</button>
    <button class="ch" onclick="ins('ô')">ô</button>
    <button class="ch" onclick="ins('ù')">ù</button>
    <button class="ch" onclick="ins('û')">û</button>
    <button class="ch" onclick="ins('ü')">ü</button>
    <button class="ch" onclick="ins('ç')">ç</button>
    <button class="ch" onclick="ins('œ')">œ</button>
    <button class="ch" onclick="ins('æ')">æ</button>
    <button class="ch" onclick="ins('É')">É</button>
    <button class="ch" onclick="ins('È')">È</button>
    <button class="ch" onclick="ins('À')">À</button>
  </div>
  <div class="prac-prog">
    <div class="prog-bar"><div class="prog-fill" id="prac-prog-fill" style="width:0%"></div></div>
    <div class="prog-txt" id="prac-prog-txt">0 / 0 revealed</div>
  </div>
  <div class="ex-list" id="ex-list"></div>
  <div class="prac-foot">
    <button class="btn-sec btn-reset" onclick="resetPractice()">↺ Reset</button>
    <button class="btn-sec btn-reveal-all" onclick="revealAll()">Reveal all</button>
  </div>
  <div class="completion" id="completion">
    <div class="comp-stars" id="comp-stars"></div>
    <div class="comp-msg" id="comp-msg"></div>
    <div class="comp-sub" id="comp-sub"></div>
    <div class="comp-btns">
      <button class="comp-btn" onclick="resetPractice()">↺ Try again</button>
      <button class="comp-btn" onclick="nav('/results/'+currentTrack)">📊 History</button>
      <button class="comp-btn comp-next" id="comp-next-btn" onclick="navNextTrack()">Next track →</button>
    </div>
  </div>
</div>

<!-- RESULTS -->
<div id="view-results" class="view">
  <div class="lesson-nav">
    <button class="btn-back" onclick="navLesson(currentTrack)">← Lesson</button>
  </div>
  <div class="results-head">
    <div class="lesson-num" id="results-num" style="font-family:var(--mono);font-size:.6rem;background:var(--accent);color:#fff;padding:2px 8px;border-radius:3px;display:inline-block;margin-bottom:.4rem"></div>
    <div class="lesson-title" id="results-title" style="font-size:1.2rem;font-weight:bold;font-style:italic;margin-bottom:.8rem"></div>
  </div>
  <div id="results-body"></div>
  <button class="btn-practice-again" onclick="navPractice()">Practice again →</button>
</div>

<script>
// ── DATA & STATE ────────────────────────────────────────────────────────────
let TRACKS = {}, EXERCISES = {};
let currentTrack = 1;
let activeInput = null;
let practiceState = {}; // {ok, near, bad, done, scores:{idx:result}}

// ── STORAGE ─────────────────────────────────────────────────────────────────
const store = {
  _key: 'lt_fr_v1',
  load(){ try{ return JSON.parse(localStorage.getItem(this._key)||'{}') }catch(e){ return {} } },
  save(d){ try{ localStorage.setItem(this._key, JSON.stringify(d)) }catch(e){} },
  getHistory(t){ const d=this.load(); return (d.history||{})[t]||[] },
  addAttempt(t, attempt){
    const d=this.load();
    if(!d.history) d.history={};
    if(!d.history[t]) d.history[t]=[];
    d.history[t].unshift(attempt);
    if(d.history[t].length>20) d.history[t]=d.history[t].slice(0,20);
    this.save(d);
  },
  getProgress(t){ const d=this.load(); return (d.progress||{})[t]||null },
  saveProgress(t, p){
    const d=this.load();
    if(!d.progress) d.progress={};
    d.progress[t]=p;
    this.save(d);
  },
  clearProgress(t){
    const d=this.load();
    if(d.progress && d.progress[t]) delete d.progress[t];
    this.save(d);
  },
  getBestScore(t){
    const h=this.getHistory(t);
    if(!h.length) return null;
    return h.reduce((best,a)=>{
      const pct=Math.round(a.ok/a.total*100);
      return pct>(best.pct||0)?{...a,pct}:best;
    },{pct:0});
  }
};

// ── ROUTING ─────────────────────────────────────────────────────────────────
function nav(path){ window.location.hash = '#' + path }
function getPath(){ return window.location.hash.replace('#','') || '/' }

function navLesson(t){ currentTrack=t; nav('/track/'+t) }
function navPractice(){ nav('/track/'+currentTrack+'/practice') }
function navResults(){ nav('/results/'+currentTrack) }
function navPrevLesson(){ if(currentTrack>1) navLesson(currentTrack-1) }
function navNextLesson(){ if(currentTrack<40) navLesson(currentTrack+1) }
function navNextTrack(){
  if(currentTrack<40){ currentTrack++; nav('/track/'+currentTrack) }
  else nav('/')
}

window.addEventListener('hashchange', route);

function route(){
  const path = getPath();
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));

  const mTrack = path.match(/^\/track\/(\d+)$/);
  const mPrac  = path.match(/^\/track\/(\d+)\/practice$/);
  const mRes   = path.match(/^\/results\/(\d+)$/);

  if(mTrack){ currentTrack=parseInt(mTrack[1]); renderLesson(); show('view-lesson') }
  else if(mPrac){ currentTrack=parseInt(mPrac[1]); renderPractice(); show('view-practice') }
  else if(mRes){ currentTrack=parseInt(mRes[1]); renderResults(); show('view-results') }
  else{ renderHome(); show('view-home') }

  window.scrollTo({top:0,behavior:'smooth'});
}

function show(id){ document.getElementById(id).classList.add('active') }

// ── HOME ─────────────────────────────────────────────────────────────────────
function renderHome(){
  document.getElementById('topbar-sub').textContent = '40 tracks';

  // Continue button
  const cont = document.getElementById('continue-bar');
  const lastTrack = getLastActiveTrack();
  if(lastTrack){
    const t = TRACKS[lastTrack];
    cont.innerHTML = `<button class="continue-btn" onclick="navLesson(${lastTrack})">
      Continue: Track ${lastTrack} — ${t.title} <span class="arrow">→</span>
    </button>`;
  } else {
    cont.innerHTML = `<button class="continue-btn" onclick="navLesson(1)">
      Start with Track 1 <span class="arrow">→</span>
    </button>`;
  }

  // Grid
  const grid = document.getElementById('track-grid');
  grid.innerHTML = Object.entries(TRACKS).map(([t,track])=>{
    const best = store.getBestScore(t);
    const progress = store.getProgress(t);
    const total = (EXERCISES[t]||[]).length;
    const stars = best ? pctToStars(best.pct) : '';
    const pct   = best ? best.pct : 0;
    const donePct = progress ? Math.round(Object.keys(progress.scores||{}).length / total * 100) : 0;
    const isDone = best != null;
    return `<div class="track-card${isDone?' done':''}" onclick="navLesson(${t})">
      <div class="tc-top">
        <span class="tc-num">${t}</span>
        <span class="tc-stars">${stars}</span>
      </div>
      <div class="tc-title">${track.title}</div>
      <div class="tc-bar"><div class="tc-bar-fill" style="width:${donePct}%"></div></div>
      <div class="tc-meta">${best?`Best: ${best.pct}%`:progress?'In progress':'Not started'}</div>
    </div>`;
  }).join('');
}

function getLastActiveTrack(){
  const d = store.load();
  const hist = d.history || {};
  const prog = d.progress || {};
  const allTracks = [...new Set([...Object.keys(hist),...Object.keys(prog)])];
  if(!allTracks.length) return null;
  return Math.max(...allTracks.map(Number));
}

// ── LESSON ───────────────────────────────────────────────────────────────────
function renderLesson(){
  const t = currentTrack;
  const track = TRACKS[t];
  if(!track) return;

  document.getElementById('topbar-sub').textContent = `Track ${t} / 40`;
  document.getElementById('btn-prev-lesson').disabled = t <= 1;
  document.getElementById('btn-next-lesson').disabled = t >= 40;

  const best = store.getBestScore(String(t));
  const stars = best ? ` · ${pctToStars(best.pct)} ${best.pct}%` : '';

  const wordsHTML = track.words.map(([fr,en])=>
    `<div class="word-chip"><span class="wc-fr">${fr}</span><span class="wc-en">${en}</span></div>`
  ).join('');

  const sentsHTML = track.sentences.map(([fr,en])=>
    `<tr><td>${fr}</td><td>${en}</td></tr>`
  ).join('');

  document.getElementById('lesson-content').innerHTML = `
    <div class="lesson-head">
      <span class="lesson-num">Track ${t}${stars}</span>
      <div class="lesson-title">${track.title}</div>
      <div class="lesson-context">${track.context}</div>
    </div>
    <div class="section-label">Grammar & structure</div>
    <div class="grammar-box">${track.grammar}</div>
    <div class="section-label">Word building & roots</div>
    <div class="word-grid">${wordsHTML}</div>
    <div class="section-label">Core sentences</div>
    <table class="sent-table"><tbody>${sentsHTML}</tbody></table>
  `;

  document.getElementById('btn-start-practice').textContent =
    best ? 'Practice again →' : 'Start Practice →';
}

// ── PRACTICE ─────────────────────────────────────────────────────────────────
function renderPractice(){
  const t = currentTrack;
  const track = TRACKS[t];
  const exercises = EXERCISES[String(t)] || [];
  if(!track) return;

  document.getElementById('topbar-sub').textContent = `Track ${t} — Practice`;
  document.getElementById('prac-track-label').textContent = `Track ${t}: ${track.title}`;
  document.getElementById('comp-next-btn').style.display = t < 40 ? '' : 'none';

  // Load saved progress
  const saved = store.getProgress(t);
  practiceState = { ok:0, near:0, bad:0, done:0, scores:{} };
  if(saved){ practiceState = { ...practiceState, ...saved } }

  // Build exercises HTML
  const listEl = document.getElementById('ex-list');
  listEl.innerHTML = exercises.map((ex,i)=>{
    const eid = `e${i}`;
    const chal = ex.c ? ' chal' : '';
    const badge = ex.c ? '<span class="cbadge">challenge</span>' : '';
    const saved_result = practiceState.scores[i];
    const answered = saved_result != null;
    const inpCls = answered ? ` ${saved_result}` : '';
    const ansDsp = answered ? 'flex' : 'none';
    const chkMap = {ok:'✓ correct',near:'~ close',bad:'✗ wrong',skip:'— skipped'};
    const chkCls = answered ? ` ${saved_result}` : '';
    const chkTxt = answered ? (chkMap[saved_result]||'') : '';
    const savedVal = answered ? (practiceState.inputs?.[i]||'') : '';
    return `<div class="ex${chal}" id="ex-${eid}" data-idx="${i}">
  <div class="ex-en">${ex.en}${badge?' '+badge:''}</div>
  <div class="ex-row">
    <input class="ex-inp${inpCls}" id="i-${eid}" value="${savedVal.replace(/"/g,'&quot;')}"
      data-answer="${ex.fr.replace(/"/g,'&quot;')}" placeholder="Type French here…"
      autocomplete="off" autocorrect="off" spellcheck="false"
      ${answered?'disabled':''}
      onfocus="activeInput=this"
      onkeydown="if(event.key==='Enter')doReveal(${i})">
    <button class="btn-rev" id="b-${eid}" onclick="doReveal(${i})"
      ${answered?'disabled':''}>Reveal</button>
  </div>
  <div class="ex-ans" id="a-${eid}" style="display:${ansDsp}">
    <span class="ans-lbl">Answer:</span>
    <span class="ans-txt">${ex.fr}</span>
    <span class="chk${chkCls}" id="c-${eid}">${chkTxt}</span>
  </div>
</div>`;
  }).join('');

  updateScoreDisplay();
  document.getElementById('completion').style.display = 'none';

  // If already complete, show completion
  if(practiceState.done === exercises.length && exercises.length > 0){
    showCompletion(false);
  }
}

function doReveal(idx){
  const t = currentTrack;
  const exercises = EXERCISES[String(t)] || [];
  const ex = exercises[idx];
  if(!ex) return;

  const eid = `e${idx}`;
  const inp = document.getElementById(`i-${eid}`);
  const ans = document.getElementById(`a-${eid}`);
  const chk = document.getElementById(`c-${eid}`);
  const btn = document.getElementById(`b-${eid}`);
  if(btn.disabled) return;

  const result = scoreAnswer(inp.value, ex.fr);
  const labels = {ok:'✓ correct',near:'~ close',bad:'✗ wrong',skip:'— skipped'};

  ans.style.display = 'flex';
  btn.disabled = true;
  inp.disabled = true;
  inp.classList.add(result === 'skip' ? 'bad' : result);
  chk.textContent = labels[result]||'';
  chk.className = `chk ${result === 'skip' ? 'bad' : result}`;

  if(!practiceState.scores) practiceState.scores = {};
  if(!practiceState.inputs) practiceState.inputs = {};
  practiceState.scores[idx] = result === 'skip' ? 'bad' : result;
  practiceState.inputs[idx] = inp.value;

  if(result === 'ok' || result === 'skip_ok') practiceState.ok++;
  else if(result === 'near') practiceState.near++;
  else practiceState.bad++;
  practiceState.done++;

  // Bump animation
  const scEl = document.getElementById(
    result === 'ok' ? 'sc-ok' : result === 'near' ? 'sc-near' : 'sc-bad');
  scEl.classList.remove('bump'); void scEl.offsetWidth; scEl.classList.add('bump');

  updateScoreDisplay();
  store.saveProgress(t, practiceState);

  if(practiceState.done === exercises.length) setTimeout(()=>showCompletion(true), 450);
}

function revealAll(){
  const exercises = EXERCISES[String(currentTrack)] || [];
  exercises.forEach((_,i)=>{
    if(practiceState.scores?.[i] == null) doReveal(i);
  });
}

function resetPractice(){
  store.clearProgress(currentTrack);
  practiceState = {ok:0,near:0,bad:0,done:0,scores:{},inputs:{}};
  renderPractice();
  window.scrollTo({top:0,behavior:'smooth'});
}

function updateScoreDisplay(){
  const exercises = EXERCISES[String(currentTrack)] || [];
  const total = exercises.length;
  const s = practiceState;
  document.getElementById('sc-ok').textContent   = '✓ ' + s.ok;
  document.getElementById('sc-near').textContent = '~ ' + s.near;
  document.getElementById('sc-bad').textContent  = '✗ ' + s.bad;
  const pct = s.done ? Math.round(s.ok / s.done * 100) : 0;
  document.getElementById('sc-pct').textContent = pct + '%';
  const progPct = total ? Math.round(s.done / total * 100) : 0;
  document.getElementById('prac-prog-fill').style.width = progPct + '%';
  document.getElementById('prac-prog-txt').textContent =
    `${s.done} / ${total} revealed · ${s.ok} correct · ${s.bad} wrong`;
}

function showCompletion(save){
  const exercises = EXERCISES[String(currentTrack)] || [];
  const total = exercises.length;
  const s = practiceState;
  const pct = total ? Math.round(s.ok / total * 100) : 0;
  const stars = pctToStars(pct);
  const msgs = {'★★★':'Excellent!','★★☆':'Well done!','★☆☆':'Good effort!','☆☆☆':'Keep at it!'};

  document.getElementById('comp-stars').textContent = stars;
  document.getElementById('comp-msg').textContent = msgs[stars] || 'Done!';
  document.getElementById('comp-sub').innerHTML =
    `${s.ok} correct · ${s.near} close · ${s.bad} wrong · ${pct}% accuracy<br>
     <span style="font-size:.65rem">Track ${currentTrack} / 40</span>`;
  document.getElementById('completion').style.display = 'block';
  document.getElementById('completion').scrollIntoView({behavior:'smooth',block:'nearest'});

  if(save){
    store.addAttempt(String(currentTrack), {
      ts: Date.now(), ok: s.ok, near: s.near, bad: s.bad, total
    });
    store.clearProgress(currentTrack);
  }
}

// ── RESULTS ──────────────────────────────────────────────────────────────────
function renderResults(){
  const t = currentTrack;
  const track = TRACKS[t];
  document.getElementById('results-num').textContent = `Track ${t}`;
  document.getElementById('results-title').textContent = track?.title || '';
  document.getElementById('topbar-sub').textContent = `Track ${t} — History`;

  const history = store.getHistory(String(t));
  const body = document.getElementById('results-body');

  if(!history.length){
    body.innerHTML = '<div class="no-history">No attempts yet — go practise first!</div>';
    return;
  }

  const best = store.getBestScore(String(t));
  const bestPct = best ? best.pct : 0;

  const attHTML = history.map((a,i)=>{
    const pct = Math.round(a.ok / a.total * 100);
    const date = new Date(a.ts).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
    const stars = pctToStars(pct);
    return `<div class="attempt${pct===bestPct&&i===history.findIndex(x=>Math.round(x.ok/x.total*100)===bestPct)?' done':''}">
      <span class="att-num">#${history.length-i}</span>
      <span class="att-date">${date}</span>
      <span class="att-stars">${stars}</span>
      <span class="att-pct">${pct}%</span>
      <span class="att-detail">${a.ok}✓ ${a.near}~ ${a.bad}✗ / ${a.total}</span>
    </div>`;
  }).join('');

  body.innerHTML = `
    <div class="results-best">
      <span class="best-label">Best</span>
      <span class="best-stars">${pctToStars(bestPct)}</span>
      <span class="best-pct">${bestPct}%</span>
      <span class="best-detail">${best.ok} correct / ${best.total} total · ${history.length} attempt${history.length===1?'':'s'}</span>
    </div>
    <div class="attempt-list">${attHTML}</div>
  `;
}

// ── SCORING ───────────────────────────────────────────────────────────────────
function stripAccents(s){
  return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}
function clean(s){
  return stripAccents(s.toLowerCase()).replace(/[?!.,;:«»''""—\-]/g,'').replace(/\s+/g,' ').trim();
}
function lev(a,b){
  if(!a.length) return b.length;
  if(!b.length) return a.length;
  const d=[];
  for(let i=0;i<=a.length;i++) d[i]=[i];
  for(let j=0;j<=b.length;j++) d[0][j]=j;
  for(let i=1;i<=a.length;i++)
    for(let j=1;j<=b.length;j++)
      d[i][j]=a[i-1]===b[j-1]?d[i-1][j-1]:1+Math.min(d[i-1][j],d[i][j-1],d[i-1][j-1]);
  return d[a.length][b.length];
}
function scoreAnswer(input, answer){
  const u = clean(input), a = clean(answer);
  if(!u) return 'skip';
  if(u === a) return 'ok';
  const dist = lev(u, a);
  if(dist <= 3) return 'ok';                               // ≤3 chars diff = correct
  if(dist <= Math.max(7, Math.floor(a.length * 0.12))) return 'near';  // close
  return 'bad';
}

// ── CHAR INSERTION ────────────────────────────────────────────────────────────
function ins(ch){
  const el = activeInput;
  if(!el || el.disabled) return;
  const s=el.selectionStart, e=el.selectionEnd;
  el.value = el.value.slice(0,s)+ch+el.value.slice(e);
  el.selectionStart = el.selectionEnd = s+ch.length;
  el.focus();
}

// ── UTILS ─────────────────────────────────────────────────────────────────────
function pctToStars(pct){
  if(pct >= 90) return '★★★';
  if(pct >= 70) return '★★☆';
  if(pct >= 50) return '★☆☆';
  return '☆☆☆';
}

// ── INIT ──────────────────────────────────────────────────────────────────────
async function init(){
  try{
    [TRACKS, EXERCISES] = await Promise.all([
      fetch('data/tracks.json').then(r=>r.json()),
      fetch('data/exercises.json').then(r=>r.json())
    ]);
    document.getElementById('loading').style.display = 'none';
    route();
  } catch(e){
    document.getElementById('loading').innerHTML =
      '<p style="color:#a83232">Failed to load data. Check your connection.</p>';
  }
}

// Keyboard navigation (not while typing)
document.addEventListener('keydown',e=>{
  if(document.activeElement.tagName==='INPUT') return;
  const path = getPath();
  if(path.startsWith('/track/') && !path.includes('/practice')){
    if(e.key==='ArrowRight') navNextLesson();
    if(e.key==='ArrowLeft')  navPrevLesson();
    if(e.key==='Enter') navPractice();
  }
});

init();
</script>
